<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Enviar propuesta</title>
<style>
/* VOICE: herramienta interna, directa
   IDEA: el borrador del mensaje listo para mandar
   PICTURE: la burbuja de WhatsApp con el texto
   COLOUR and TYPE: verde WhatsApp, fondo claro; system-ui
   LAYOUT: nombre, burbuja, botón grande */
:root{color-scheme:light dark;--bg:light-dark(#efeae2,#0b141a);--ink:light-dark(#111b21,#e9edef);--bub:light-dark(#d9fdd3,#005c4b)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:20px 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{opacity:.7;margin:0 0 16px}
.bubble{background:var(--bub);border-radius:14px 14px 4px 14px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:16px;border-radius:14px;background:#25d366;color:#08331a;font-weight:800;font-size:18px;text-decoration:none}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit;font-size:16px;min-height:48px}
button.btn{width:100%;border:0;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1 id="t">Propuesta</h1>
  <p class="sub" id="s"></p>
  <div class="bubble" id="m"></div>
  <a class="btn" id="go" href="#" rel="noopener">Abrir WhatsApp con este mensaje</a>
  <button class="btn ghost" id="cp">Copiar el mensaje</button>
  <p class="sub" style="margin-top:14px">Si WhatsApp dice que el número no está, es un teléfono fijo: mejor llama.</p>
</main>
<script>
{
const q=new URLSearchParams(location.search);
const name=(q.get('n')||'su colmado').slice(0,40),zone=(q.get('z')||'').slice(0,40),tel=(q.get('t')||'').replace(/\D/g,''),hook=q.get('h')||'gen';
const base=location.origin+'/colmado/?n='+encodeURIComponent(name)+(zone?'&z='+encodeURIComponent(zone):'');
let hr=new Date().getHours();try{hr=+new Intl.DateTimeFormat('en-US',{hour:'numeric',hour12:false,timeZone:'America/Santo_Domingo'}).format(new Date())%24}catch(e){}
const saludo=hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';
const HOOK={
  del:'Con la página, los pedidos de delivery le llegan escritos y completos por WhatsApp: menos llamadas y menos confusiones.',
  bar:'Sus clientes ven las ofertas del día y la fría antes de llegar, y pueden pedir para recoger sin esperar.',
  gen:'Sus clientes ven todo lo que usted tiene, con precios y fotos, y le piden directo por WhatsApp o pasan a buscarlo.'
};
const msg=`${saludo}, ¿hablo con el encargado de ${name}? Soy Cédric.

Le preparé un ejemplo de página para ${name}${zone?' en '+zone:''}. Mírela:

👉 Lo que ven sus clientes:
${base}#tienda

👉 Lo que usted maneja desde el celular (PIN 1234):
${base}#panel

${HOOK[hook]||HOOK.gen}

Es bien fácil: usted le habla al celular («el arroz a 40», «se acabó el pan») y la página se cambia sola. También lleva el fiao, el inventario y las ventas del día.

Dígame qué le parece. Con solo darme el permiso, le preparo el sitio con el nombre de ${name}.`;
document.getElementById('t').textContent=name;
document.getElementById('s').textContent=(zone?zone+' · ':'')+(tel?'+'+tel:'sin número');
document.getElementById('m').textContent=msg;
document.getElementById('go').href='https://wa.me/'+tel+'?text='+encodeURIComponent(msg);
document.getElementById('cp').onclick=()=>{try{navigator.clipboard.writeText(msg).then(()=>{document.getElementById('cp').textContent='¡Copiado!'})}catch(e){}};
}
</script>
</body>
</html>
