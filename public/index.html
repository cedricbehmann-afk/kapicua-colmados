<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1747b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<title>Mi Colmado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: directo y alegre, como llegar al colmado del barrio
   IDEA: el letrero del colmado + las ruedas para elegir zona y colmado
   PICTURE: toldo de rayas azul y blanco sobre el letrero rojo con el nombre elegido
   COLOUR and TYPE: azul toldo, amarillo pared, rojo letrero; Lilita One + Nunito
   LAYOUT: letrero arriba, dos ruedas, y luego las dos puertas: pedir o panel del dueño */
:root{color-scheme:light dark;--bg:light-dark(#fff8e6,#12100c);--ink:light-dark(#1f1a12,#f7efdf);--soft:light-dark(#6b5d45,#c9b993);
--card:light-dark(#fff,#1e1a14);--line:light-dark(#efe2c2,#3a3226);--sun:#ffc928;--blue:#1747b8;--red:#d62839}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:"Lilita One",Impact,sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
.top{background:var(--sun);padding:0 0 28px}
.awning{height:46px;background:repeating-linear-gradient(90deg,var(--blue) 0 34px,#fff 34px 68px);-webkit-mask:radial-gradient(17px at 17px 100%,#0000 98%,#000) 0 0/34px 100%;mask:radial-gradient(17px at 17px 100%,#0000 98%,#000) 0 0/34px 100%}
.sign{margin:22px auto 0;width:min(560px,calc(100% - 32px));background:var(--red);color:#fff;border-radius:14px;padding:16px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.sign small{display:block;font-weight:800;opacity:.9;margin-bottom:4px}
.sign h1{font-size:clamp(30px,7vw,46px)}
main{width:min(560px,calc(100% - 32px));margin:24px auto 40px}
label{display:block;font-weight:800;margin:16px 0 6px}
select{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 18px Nunito,sans-serif;padding:0 14px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.doors{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:22px}
@media(max-width:420px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;min-height:130px;border-radius:18px;padding:18px;text-decoration:none;font-weight:700}
.door b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:24px;line-height:1.1}
.door.shop{background:var(--blue);color:#fff}.door.owner{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.door[aria-disabled=true]{opacity:.4;pointer-events:none}
.note{color:var(--soft);font-size:14px;margin-top:18px}
</style>
</head>
<body>
<header class="top">
  <div class="awning" aria-hidden="true"></div>
  <div class="sign"><small id="zonelbl">Elige tu colmado</small><h1 id="cname">Mi Colmado</h1></div>
</header>
<main>
  <label for="zone">1. Tu zona</label>
  <select id="zone"><option>Cargando…</option></select>
  <label for="colm">2. Tu colmado</label>
  <select id="colm"></select>
  <div class="doors">
    <a class="door shop" id="toshop" href="#"><b>Hacer un pedido</b>Ver productos y pedir por WhatsApp</a>
    <a class="door owner" id="toowner" href="#"><b>Soy el dueño</b>Entrar a mi panel</a>
  </div>
  <p class="note">Aquí salen los colmados que ya están inscritos. ¿Tu colmado no está? Pídele al dueño que se inscriba.</p>
</main>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let list=[],last={};
try{last=JSON.parse(localStorage.getItem('mi-colmado-last')||'{}')}catch(e){}
function zones(){return[...new Set(list.map(c=>c.zona))].sort((a,b)=>a.localeCompare(b,'es'))}
function fillColm(){
  const z=$('#zone').value,cs=list.filter(c=>c.zona===z).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  $('#colm').innerHTML=cs.map(c=>`<option value="${esc(c.slug)}">${esc(c.nombre)}</option>`).join('');
  if(cs.some(c=>c.slug===last.slug))$('#colm').value=last.slug;
  pick();
}
function pick(){
  const c=list.find(x=>x.slug===$('#colm').value);
  $('#cname').textContent=c?c.nombre:'Mi Colmado';$('#zonelbl').textContent=c?c.zona:'Elige tu colmado';
  ['#toshop','#toowner'].forEach(s=>$(s).setAttribute('aria-disabled',!c));
  if(!c)return;
  const base='/colmado/?c='+encodeURIComponent(c.slug);
  $('#toshop').href=base+'#tienda';$('#toowner').href=base+'#panel';
  try{localStorage.setItem('mi-colmado-last',JSON.stringify({zona:c.zona,slug:c.slug}))}catch(e){}
  last={zona:c.zona,slug:c.slug};
}
$('#zone').addEventListener('change',fillColm);$('#colm').addEventListener('change',pick);
fetch('/colmados.json').then(r=>r.json()).then(d=>{list=Array.isArray(d)?d:[];
  const zs=zones();$('#zone').innerHTML=zs.map(z=>`<option>${esc(z)}</option>`).join('')||'<option>Sin colmados todavía</option>';
  if(zs.includes(last.zona))$('#zone').value=last.zona;fillColm();
}).catch(()=>{$('#zone').innerHTML='<option>Sin conexión</option>';pick()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
</body>
</html>
